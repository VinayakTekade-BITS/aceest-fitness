name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile (syntax check)
        run: python -m compileall -q app.py aceest tests
      - name: Lint with flake8
        run: flake8 .

  docker-build:
    name: Docker Image Assembly
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target runtime -t aceest-fitness:latest .
      - name: Build test image
        run: docker build --target test -t aceest-fitness:test .
      - name: Save images
        run: docker save aceest-fitness:latest aceest-fitness:test | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: images.tar.gz
          retention-days: 1

  test:
    name: Automated Testing (in container)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-images
      - name: Load images
        run: gunzip -c images.tar.gz | docker load
      - name: Run pytest inside the container
        run: docker run --rm aceest-fitness:test
      - name: Smoke test the runtime container
        run: |
          docker run -d --name aceest -p 5000:5000 aceest-fitness:latest
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then exit 0; fi
            sleep 2
          done
          docker logs aceest
          exit 1
