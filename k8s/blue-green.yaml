# Blue-green: two complete copies of the app. The aceest-bluegreen Service sends all live
# traffic to one color; the preview Service points at the other (idle) color, which holds the
# next version before the switch and the previous version after it.
# Template: deploy/k8s/blue-green.sh fills in __BLUE_IMAGE__, __GREEN_IMAGE__, __LIVE_COLOR__
# and __IDLE_COLOR__ and applies it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest
  labels: {app: aceest, strategy: blue-green, color: blue}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 90
  selector:
    matchLabels: {app: aceest, strategy: blue-green, color: blue}
  template:
    metadata:
      labels: {app: aceest, strategy: blue-green, color: blue}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: __BLUE_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 5000}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: aceest-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest
  labels: {app: aceest, strategy: blue-green, color: green}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 90
  selector:
    matchLabels: {app: aceest, strategy: blue-green, color: green}
  template:
    metadata:
      labels: {app: aceest, strategy: blue-green, color: green}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: __GREEN_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 5000}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: aceest-data}
        - name: tmp
          emptyDir: {}
---
# live traffic: the switch is a change of this selector
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen
  namespace: aceest
  labels: {app: aceest, strategy: blue-green}
spec:
  type: NodePort
  selector: {app: aceest, strategy: blue-green, color: __LIVE_COLOR__}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30082}
---
# the idle color, for testing a new version before it goes live
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen-preview
  namespace: aceest
  labels: {app: aceest, strategy: blue-green}
spec:
  type: NodePort
  selector: {app: aceest, strategy: blue-green, color: __IDLE_COLOR__}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30086}
