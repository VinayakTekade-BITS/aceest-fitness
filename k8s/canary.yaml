# Canary release: a stable track (3 pods) and a canary track (0 or 1 pod) behind ONE Service.
# The Service selects both tracks, so with 3 + 1 pods about 25 % of requests reach the canary.
# Template: deploy/k8s/canary.sh fills in __STABLE_IMAGE__, __CANARY_IMAGE__ and
# __CANARY_REPLICAS__ and applies it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
  namespace: aceest
  labels: {app: aceest, strategy: canary, track: stable}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 90
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: aceest, strategy: canary, track: stable}
  template:
    metadata:
      labels: {app: aceest, strategy: canary, track: stable}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: __STABLE_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 5000}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: aceest-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest
  labels: {app: aceest, strategy: canary, track: canary}
spec:
  replicas: __CANARY_REPLICAS__
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 90
  selector:
    matchLabels: {app: aceest, strategy: canary, track: canary}
  template:
    metadata:
      labels: {app: aceest, strategy: canary, track: canary}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: __CANARY_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 5000}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: aceest-data}
        - name: tmp
          emptyDir: {}
---
# selects BOTH tracks (no "track" label in the selector)
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary
  namespace: aceest
  labels: {app: aceest, strategy: canary}
spec:
  type: NodePort
  selector: {app: aceest, strategy: canary}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30083}
