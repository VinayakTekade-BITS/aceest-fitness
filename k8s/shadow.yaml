# Shadow deployment: users are answered by the live track (the previous stable release).
# An nginx router also sends a copy ("mirror") of every request to the shadow track (the new
# release) and throws the shadow's responses away, so the new release is tested with real
# traffic without any user seeing its answers.
# The shadow has its own throw-away database (emptyDir), so mirrored writes never reach
# the real data.
# Template: deploy/k8s/shadow.sh fills in __LIVE_IMAGE__, __SHADOW_IMAGE__ and
# __SHADOW_REPLICAS__ and applies it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-live
  namespace: aceest
  labels: {app: aceest, strategy: shadow, track: live}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 90
  selector:
    matchLabels: {app: aceest, strategy: shadow, track: live}
  template:
    metadata:
      labels: {app: aceest, strategy: shadow, track: live}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: __LIVE_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 5000}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: aceest-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
  labels: {app: aceest, strategy: shadow, track: shadow}
spec:
  replicas: __SHADOW_REPLICAS__
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 90
  selector:
    matchLabels: {app: aceest, strategy: shadow, track: shadow}
  template:
    metadata:
      labels: {app: aceest, strategy: shadow, track: shadow}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: __SHADOW_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 5000}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          emptyDir: {}          # isolated database: mirrored writes stay here
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-live
  namespace: aceest
  labels: {app: aceest, strategy: shadow}
spec:
  selector: {app: aceest, strategy: shadow, track: live}
  ports:
    - {name: http, port: 5000, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
  namespace: aceest
  labels: {app: aceest, strategy: shadow}
spec:
  selector: {app: aceest, strategy: shadow, track: shadow}
  ports:
    - {name: http, port: 5000, targetPort: http}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aceest-shadow-router
  namespace: aceest
  labels: {app: aceest-router, strategy: shadow}
data:
  default.conf: |
    upstream live   { server aceest-shadow-live:5000; }
    upstream shadow { server aceest-shadow:5000; }

    server {
        listen 8080;

        location / {
            mirror /_shadow;              # copy the request to the shadow track
            mirror_request_body on;
            proxy_pass http://live;       # only the live answer goes back to the user
            add_header X-Shadowed-To aceest-shadow always;
        }

        location = /_shadow {
            internal;
            proxy_pass http://shadow$request_uri;
            proxy_connect_timeout 1s;     # a slow or missing shadow must not delay users
            proxy_read_timeout 2s;
            proxy_set_header X-Shadow-Request "1";
        }

        location = /router-health {
            access_log off;
            return 200 "ok\n";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-router
  namespace: aceest
  labels: {app: aceest-router, strategy: shadow}
spec:
  replicas: 1
  selector:
    matchLabels: {app: aceest-router, strategy: shadow}
  template:
    metadata:
      labels: {app: aceest-router, strategy: shadow}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /router-health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /router-health, port: http}
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: aceest-shadow-router}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-router
  namespace: aceest
  labels: {app: aceest-router, strategy: shadow}
spec:
  type: NodePort
  selector: {app: aceest-router, strategy: shadow}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30085}
